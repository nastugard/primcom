<div class="modal" id="lead-modal" data-lead-modal hidden>
  <div class="modal__backdrop" data-modal-close></div>
  <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="lead-modal-title" aria-describedby="lead-modal-description" tabindex="-1">
    <button class="modal__close" type="button" aria-label="Закрыть заявку" data-modal-close>×</button>
    <h2 class="modal__title" id="lead-modal-title">Подобрать автомобиль</h2>
    <p class="modal__lead" id="lead-modal-description">Укажите, что ищете. Менеджер уточнит доступные варианты и стоимость до вашего города.</p>
    <p class="lead-context" data-lead-context hidden></p>
    <form class="form ym-disable-submit" data-lead-form>
      <label class="hp" aria-hidden="true">Company<input type="text" name="company" tabindex="-1" autocomplete="off" /></label>
      <div class="lead-fields">
        <label class="field"><span class="field__label">Имя</span><input class="field__control" name="name" type="text" autocomplete="name" maxlength="100" required /></label>
        <label class="field"><span class="field__label">Телефон</span><input class="field__control" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" required /></label>
        <label class="field"><span class="field__label">Город получения</span><input class="field__control" name="city" type="text" autocomplete="address-level2" maxlength="100" placeholder="Например, Владивосток" /></label>
        <label class="field"><span class="field__label">Бюджет, ₽</span><select class="field__control" name="budget"><option value="">Пока не определился</option><option value="до 1,5 млн ₽">До 1,5 млн ₽</option><option value="до 2 млн ₽">До 2 млн ₽</option><option value="до 2,5 млн ₽">До 2,5 млн ₽</option><option value="до 3 млн ₽">До 3 млн ₽</option><option value="свыше 3 млн ₽">Свыше 3 млн ₽</option></select></label>
      </div>
      <label class="field"><span class="field__label">Пожелания к машине</span><textarea class="field__control" name="comment" rows="2" maxlength="1200" placeholder="Модель, год, привод или ссылка на предложение"></textarea></label>
      <label class="check"><input class="check__control" type="checkbox" name="consent" required /><span class="check__text">Я согласен(на) на обработку персональных данных. <a href="/pages/consent.html">Текст согласия</a></span></label>
      <p class="form__disclaimer">Наличие, актуальная цена, состав расходов и сроки согласуются до покупки. Информация не является публичной офертой.</p>
      <button class="btn btn--primary" type="submit">Получить варианты и расчёт</button>
      <p class="form__status" data-form-status role="status" aria-live="polite" tabindex="-1"></p>
    </form>
  </div>
</div>
